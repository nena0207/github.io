<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ნენა</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff;
    color: #333;
}

header {
    background: white;
    text-align: center;
    padding: 20px 10px;
    border-bottom: 2px solid #f3b6d2;
    position: sticky;
    top: 0;
    z-index: 10;
}

header h1 {
    margin: 0;
    color: #ff4f9a;
    font-size: 32px;
    font-weight: bold;
}

.layout {
    display: flex;
    min-height: calc(100vh - 80px);
}

.sidebar {
    width: 240px;
    background: #fff0f7;
    padding: 15px;
    border-right: 1px solid #f3c4d9;
    flex-shrink: 0;
}

.sidebar h3 {
    margin-top: 5px;
    color: #ff4f9a;
}

.category {
    width: 100%;
    border: none;
    background: white;
    padding: 12px 10px;
    margin: 5px 0;
    border-radius: 10px;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
}

.category:hover {
    background: #ffdbea;
}

.admin-login {
    margin-top: 25px;
    border-top: 1px solid #f3c4d9;
    padding-top: 15px;
}

.login-button {
    width: 100%;
    border: none;
    background: #ff4f9a;
    color: white;
    padding: 12px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
}

.admin-status {
    display: none;
    color: #ff4f9a;
    font-weight: bold;
    margin-bottom: 8px;
}

.logout-button {
    width: 100%;
    border: none;
    background: #777;
    color: white;
    padding: 9px;
    border-radius: 8px;
    cursor: pointer;
}

main {
    flex: 1;
    padding: 20px;
    position: relative;
}

#categoryTitle {
    margin-top: 0;
    color: #ff4f9a;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.product {
    background: white;
    border: 1px solid #eee;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.product img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    display: block;
}

.product-info {
    padding: 12px;
}

.product-info h3 {
    margin: 0 0 8px;
    color: #ff4f9a;
}

.product-info p {
    margin: 0;
    line-height: 1.5;
}

.delete-button {
    margin-top: 12px;
    width: 100%;
    border: none;
    background: #e53935;
    color: white;
    padding: 9px;
    border-radius: 8px;
    cursor: pointer;
    display: none;
}

#addButton {
    display: none;
    position: fixed;
    right: 25px;
    bottom: 25px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: none;
    background: #ff4f9a;
    color: white;
    font-size: 35px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    z-index: 20;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal-box {
    width: 100%;
    max-width: 430px;
    background: white;
    border-radius: 15px;
    padding: 20px;
}

.modal-box h2 {
    margin-top: 0;
    color: #ff4f9a;
}

.modal-box input,
.modal-box textarea,
.modal-box select {
    width: 100%;
    padding: 11px;
    margin: 7px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

.modal-box textarea {
    min-height: 110px;
    resize: vertical;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.modal-buttons button {
    flex: 1;
    border: none;
    padding: 11px;
    border-radius: 8px;
    cursor: pointer;
}

.save-button {
    background: #ff4f9a;
    color: white;
}

.cancel-button {
    background: #777;
    color: white;
}

.loading {
    text-align: center;
    color: #777;
    padding: 30px;
}

@media(max-width:700px) {
    .sidebar {
        width: 180px;
    }

    .category {
        font-size: 14px;
    }

    .products {
        grid-template-columns: repeat(2, minmax(0,1fr));
        gap: 10px;
    }

    .product img {
        height: 180px;
    }

    main {
        padding: 10px;
    }
}

@media(max-width:500px) {
    .layout {
        display: block;
    }

    .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #f3c4d9;
    }

    .products {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>🌸 ნენა</h1>
</header>

<div class="layout">

    <aside class="sidebar">

        <h3>სარჩევი</h3>

        <button class="category" onclick="showCategory('ყველა')">
            🏠 მთავარი
        </button>

        <button class="category" onclick="showCategory('სუნამოები')">
            🌸 სუნამოები
        </button>

        <button class="category" onclick="showCategory('ტუშები')">
            💄 ტუშები
        </button>

        <button class="category" onclick="showCategory('სათვალეები')">
            👓 სათვალეები
        </button>

        <button class="category" onclick="showCategory('ტუჩსაცხები')">
            💄 ტუჩსაცხები
        </button>

        <button class="category" onclick="showCategory('კრემები')">
            🧴 კრემები
        </button>

        <button class="category" onclick="showCategory('შამპუნები')">
            🫧 შამპუნები
        </button>

        <button class="category" onclick="showCategory('სახის მოვლა')">
            🧖 სახის მოვლა
        </button>

        <button class="category" onclick="showCategory('სხვა')">
            🛍️ სხვა
        </button>

        <div class="admin-login">

            <div id="adminStatus" class="admin-status">
                🔐 ადმინი შესულია
            </div>

            <button id="loginButton"
                    class="login-button"
                    onclick="openLogin()">
                🔐 შესვლა
            </button>

            <button id="logoutButton"
                    class="logout-button"
                    onclick="logout()"
                    style="display:none;">
                გასვლა
            </button>

        </div>

    </aside>

    <main>

        <h2 id="categoryTitle">ყველა პროდუქტი</h2>

        <div id="loading" class="loading">
            პროდუქტები იტვირთება...
        </div>

        <div id="products" class="products"></div>

    </main>

</div>

<button id="addButton" onclick="openAddProduct()">+</button>


<!-- LOGIN MODAL -->

<div id="loginModal" class="modal">

    <div class="modal-box">

        <h2>ადმინის შესვლა</h2>

        <p>შეიყვანე 7 ციფრიანი პაროლი</p>

        <input
            id="adminPassword"
            type="password"
            inputmode="numeric"
            maxlength="7"
            placeholder="7 ციფრი"
        >

        <div class="modal-buttons">

            <button class="save-button"
                    onclick="loginAdmin()">
                შესვლა
            </button>

            <button class="cancel-button"
                    onclick="closeLogin()">
                გაუქმება
            </button>

        </div>

    </div>

</div>


<!-- ADD PRODUCT MODAL -->

<div id="productModal" class="modal">

    <div class="modal-box">

        <h2>პროდუქტის დამატება</h2>

        <input
            id="productName"
            type="text"
            placeholder="პროდუქტის სახელი"
        >

        <select id="productCategory">

            <option value="სუნამოები">🌸 სუნამოები</option>
            <option value="ტუშები">💄 ტუშები</option>
            <option value="სათვალეები">👓 სათვალეები</option>
            <option value="ტუჩსაცხები">💄 ტუჩსაცხები</option>
            <option value="კრემები">🧴 კრემები</option>
            <option value="შამპუნები">🫧 შამპუნები</option>
            <option value="სახის მოვლა">🧖 სახის მოვლა</option>
            <option value="სხვა">🛍️ სხვა</option>

        </select>

        <input
            id="productImage"
            type="file"
            accept="image/*"
        >

        <textarea
            id="productDescription"
            placeholder="კომენტარი / აღწერა"
        ></textarea>

        <div class="modal-buttons">

            <button
                class="save-button"
                onclick="addProduct()">
                ატვირთვა
            </button>

            <button
                class="cancel-button"
                onclick="closeProductModal()">
                გაუქმება
            </button>

        </div>

    </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    onSnapshot,
    query,
    orderBy,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

    apiKey: "AIzaSyDAOSh7080W70k0wLsL6w3I0ru1qRyhtgM",
    authDomain: "nena-bf825.firebaseapp.com",
    projectId: "nena-bf825",
    storageBucket: "nena-bf825.firebasestorage.app",
    messagingSenderId: "552511105234",
    appId: "1:552511105234:web:38022acc39761284a5650b",
    measurementId: "G-1YB7NH25M5"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ADMIN */

const ADMIN_EMAIL = "Valerychutlashvili@gmail.com";

const ADMIN_UID =
    "J9t8FfYXDxQI8q1YkDZOhtLmrLh2";


let isAdmin = false;

let currentCategory = "ყველა";

let products = [];


/* ELEMENTS */

const productsDiv =
    document.getElementById("products");

const loading =
    document.getElementById("loading");

const addButton =
    document.getElementById("addButton");

const loginButton =
    document.getElementById("loginButton");

const logoutButton =
    document.getElementById("logoutButton");

const adminStatus =
    document.getElementById("adminStatus");


/* LOAD PRODUCTS */

const productsQuery =
    query(
        collection(db, "products"),
        orderBy("createdAt", "desc")
    );


onSnapshot(productsQuery, (snapshot) => {

    products = [];

    snapshot.forEach((item) => {

        products.push({
            id: item.id,
            ...item.data()
        });

    });

    loading.style.display = "none";

    showCategory(currentCategory);

}, (error) => {

    console.error(error);

    loading.innerText =
        "პროდუქტების ჩატვირთვისას შეცდომაა.";

});


/* CATEGORY */

window.showCategory = function(category) {

    currentCategory = category;

    const title =
        document.getElementById("categoryTitle");

    if (category === "ყველა") {

        title.innerText = "ყველა პროდუქტი";

    } else {

        title.innerText = category;

    }

    productsDiv.innerHTML = "";

    const filtered =
        category === "ყველა"
        ? products
        : products.filter(p => p.category === category);


    if (filtered.length === 0) {

        productsDiv.innerHTML =
            "<p>ამ კატეგორიაში პროდუქტი ჯერ არ არის.</p>";

        return;
    }


    filtered.forEach(product => {

        const card =
            document.createElement("div");

        card.className = "product";


        const img =
            document.createElement("img");

        img.src = product.image;

        img.alt = product.name;


        const info =
            document.createElement("div");

        info.className = "product-info";


        const name =
            document.createElement("h3");

        name.innerText =
            product.name || "პროდუქტი";


        const description =
            document.createElement("p");

        description.innerText =
            product.description || "";


        info.appendChild(name);

        info.appendChild(description);


        if (isAdmin) {

            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "delete-button";

            deleteButton.style.display =
                "block";

            deleteButton.innerText =
                "🗑️ წაშლა";


            deleteButton.onclick =
                () => deleteProduct(product.id);


            info.appendChild(deleteButton);

        }


        card.appendChild(img);

        card.appendChild(info);

        productsDiv.appendChild(card);

    });

};


/* LOGIN */

window.openLogin = function() {

    document.getElementById("loginModal")
        .style.display = "flex";

    document.getElementById("adminPassword")
        .value = "";

};


window.closeLogin = function() {

    document.getElementById("loginModal")
        .style.display = "none";

};


window.loginAdmin = async function() {

    const password =
        document.getElementById("adminPassword").value.trim();


    if (!/^\d{7}$/.test(password)) {

        alert("შეიყვანე ზუსტად 7 ციფრი.");

        return;
    }


    try {

        const result =
            await signInWithEmailAndPassword(
                auth,
                ADMIN_EMAIL,
                password
            );


        if (result.user.uid !== ADMIN_UID) {

            await signOut(auth);

            alert("ეს ანგარიში ადმინი არ არის.");

            return;
        }


        closeLogin();

    } catch (error) {

        console.error(error);

        alert(
            "პაროლი არასწორია ან Firebase-ში მომხმარებელი ვერ მოიძებნა."
        );

    }

};


/* AUTH STATE */

onAuthStateChanged(auth, (user) => {

    if (user && user.uid === ADMIN_UID) {

        isAdmin = true;

        loginButton.style.display = "none";

        logoutButton.style.display = "block";

        adminStatus.style.display = "block";

        addButton.style.display = "block";

    } else {

        isAdmin = false;

        loginButton.style.display = "block";

        logoutButton.style.display = "none";

        adminStatus.style.display = "none";

        addButton.style.display = "none";

    }

    showCategory(currentCategory);

});


/* LOGOUT */

window.logout = async function() {

    await signOut(auth);

};


/* ADD PRODUCT */

window.openAddProduct = function() {

    if (!isAdmin) {

        alert("ადმინის შესვლა საჭიროა.");

        return;
    }

    document.getElementById("productModal")
        .style.display = "flex";

};


window.closeProductModal = function() {

    document.getElementById("productModal")
        .style.display = "none";

};


window.addProduct = async function() {

    if (!isAdmin) {

        alert("უფლება არ გაქვს.");

        return;
    }


    const name =
        document.getElementById("productName")
            .value.trim();

    const category =
        document.getElementById("productCategory")
            .value;

    const description =
        document.getElementById("productDescription")
            .value.trim();

    const file =
        document.getElementById("productImage")
            .files[0];


    if (!name) {

        alert("ჩაწერე პროდუქტის სახელი.");

        return;
    }


    if (!file) {

        alert("აირჩიე სურათი.");

        return;
    }


    try {

        const image =
            await compressImage(file);


        await addDoc(
            collection(db, "products"),
            {
                name: name,
                category: category,
                description: description,
                image: image,
                createdAt: serverTimestamp()
            }
        );


        document.getElementById("productName")
            .value = "";

        document.getElementById("productDescription")
            .value = "";

        document.getElementById("productImage")
            .value = "";


        closeProductModal();


        alert("პროდუქტი წარმატებით აიტვირთა.");

    } catch (error) {

        console.error(error);

        alert(
            "ატვირთვისას შეცდომა მოხდა."
        );

    }

};


/* IMAGE COMPRESSION */

function compressImage(file) {

    return new Promise((resolve, reject) => {

        const reader =
            new FileReader();


        reader.onload = function(event) {

            const img =
                new Image();


            img.onload = function() {

                const maxSize = 900;

                let width = img.width;

                let height = img.height;


                if (width > height && width > maxSize) {

                    height =
                        height * maxSize / width;

                    width = maxSize;

                } else if (height > maxSize) {

                    width =
                        width * maxSize / height;

                    height = maxSize;

                }


                const canvas =
                    document.createElement("canvas");

                canvas.width =
                    width;

                canvas.height =
                    height;


                const ctx =
                    canvas.getContext("2d");

                ctx.drawImage(
                    img,
                    0,
                    0,
                    width,
                    height
                );


                const result =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.65
                    );


                resolve(result);

            };


            img.onerror = reject;

            img.src =
                event.target.result;

        };


        reader.onerror = reject;

        reader.readAsDataURL(file);

    });

}


/* DELETE */

async function deleteProduct(id) {

    if (!isAdmin) {

        alert("უფლება არ გაქვს.");

        return;
    }


    if (!confirm(
        "ნამდვილად გინდა პროდუქტის წაშლა?"
    )) {

        return;
    }


    try {

        await deleteDoc(
            doc(db, "products", id)
        );

    } catch (error) {

        console.error(error);

        alert(
            "წაშლისას შეცდომა მოხდა."
        );

    }

}

</script>

</body>
</html>
