<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 ნენა</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff5fa;
      color: #444;
    }

    header {
      background: white;
      padding: 18px;
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #e91e63;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .layout {
      display: flex;
      align-items: flex-start;
    }

    .sidebar {
      width: 220px;
      min-height: calc(100vh - 70px);
      background: white;
      padding: 15px 10px;
      box-shadow: 2px 0 8px rgba(0,0,0,.08);
      position: sticky;
      top: 70px;
    }

    .sidebar button {
      width: 100%;
      border: none;
      background: white;
      padding: 10px 8px;
      margin-bottom: 7px;
      border-radius: 10px;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 11px;
      color: #444;
    }

    .sidebar button:hover {
      background: #fff7e0;
    }

    .goldIcon {
      width: 38px;
      height: 38px;
      min-width: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      background: linear-gradient(145deg, #fff8cf, #f4c542, #b77a00);
      box-shadow:
        inset 0 1px 2px rgba(255,255,255,.9),
        0 2px 5px rgba(160,110,0,.25);
    }

    .goldIcon svg {
      width: 29px;
      height: 29px;
      fill: none;
      stroke: #5c3b00;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .loginBtn {
      margin-top: 15px;
      background: #e91e63 !important;
      color: white !important;
      text-align: center !important;
      justify-content: center;
    }

    .logoutBtn {
      background: #777 !important;
      color: white !important;
      text-align: center !important;
      justify-content: center;
    }

    main {
      flex: 1;
      padding: 25px;
    }

    #categoryTitle {
      color: #e91e63;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 15px;
      padding: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      position: relative;
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      background: #f5f5f5;
    }

    .product h3 {
      margin: 12px 0 6px;
      color: #e91e63;
    }

    .product p {
      margin: 0;
      color: #666;
      white-space: pre-wrap;
    }

    .deleteBtn {
      display: none;
      width: 100%;
      margin-top: 12px;
      padding: 9px;
      border: none;
      border-radius: 8px;
      background: #f44336;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    body.admin .deleteBtn {
      display: block;
    }

    #addButton {
      display: none;
      position: fixed;
      right: 25px;
      bottom: 25px;
      width: 60px;
      height: 60px;
      border: none;
      border-radius: 50%;
      background: #e91e63;
      color: white;
      font-size: 35px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,.25);
      z-index: 20;
    }

    body.admin #addButton {
      display: block;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modalBox {
      background: white;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 18px;
      padding: 22px;
    }

    .modalBox h2 {
      color: #e91e63;
      margin-top: 0;
    }

    .modalBox input,
    .modalBox textarea,
    .modalBox select {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 16px;
    }

    .modalBox textarea {
      min-height: 100px;
      resize: vertical;
    }

    .saveBtn {
      width: 100%;
      border: none;
      background: #e91e63;
      color: white;
      padding: 13px;
      border-radius: 9px;
      font-size: 17px;
      cursor: pointer;
    }

    .closeBtn {
      width: 100%;
      border: none;
      background: #777;
      color: white;
      padding: 11px;
      border-radius: 9px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }

    #status {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    @media (max-width: 700px) {

      .layout {
        display: block;
      }

      .sidebar {
        width: 100%;
        min-height: auto;
        position: relative;
        top: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
      }

      .sidebar button {
        margin: 0;
      }

      main {
        padding: 15px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .product img {
        height: 170px;
      }

      header {
        font-size: 26px;
      }
    }
  </style>
</head>

window.openLogin = function() {

window.login = async function() {

  const password =
    document.getElementById("adminPassword").value.trim();

  if (!password) {

    alert("შეიყვანე პაროლი");

    return;

  }

  try {

    const result =
      await signInWithEmailAndPassword(
        auth,
        ADMIN_EMAIL,
        password
      );

    if (result.user.uid !== ADMIN_UID) {

      await signOut(auth);

      alert("ადმინისტრატორის ანგარიში არასწორია");

      return;

    }

    closeLogin();

    document.getElementById("adminPassword").value = "";

    alert("წარმატებით შეხვედი ✅");

  } catch (error) {

    console.error("LOGIN ERROR:", error);

    alert(
      "შესვლა ვერ მოხერხდა:\n" +
      (error.message || error.code || "უცნობი შეცდომა")
    );

  }

};


document.getElementById("adminPassword").addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      login();

    }

  }
);


onAuthStateChanged(
  auth,
  user => {

    if (user && user.uid === ADMIN_UID) {

      document.body.classList.add("admin");

      document.getElementById("loginButton").style.display = "none";

      document.getElementById("logoutButton").style.display = "block";

    } else {

      document.body.classList.remove("admin");

      document.getElementById("loginButton").style.display = "block";

      document.getElementById("logoutButton").style.display = "none";

    }

  }
);


window.logout = async function() {

  try {

    await signOut(auth);

    alert("ადმინისტრატორის რეჟიმი გამორთულია");

  } catch (error) {

    console.error(error);

  }

};


window.showCategory = function(category) {

  currentCategory = category;

  const title =
    document.getElementById("categoryTitle");

  if (category === "ყველა") {

    title.textContent = "🏠 მთავარი";

  } else {

    title.textContent = category;

  }

  renderProducts();

};


function renderProducts() {

  const container =
    document.getElementById("products");

  container.innerHTML = "";

  let products = allProducts;

  if (currentCategory !== "ყველა") {

    products =
      allProducts.filter(
        product =>
          product.category === currentCategory
      );

  }

  if (products.length === 0) {

    document.getElementById("status").style.display = "block";

    document.getElementById("status").textContent =
      "ამ კატეგორიაში პროდუქტები ჯერ არ არის.";

    return;

  }

  document.getElementById("status").style.display = "none";

  products.forEach(product => {

    const div =
      document.createElement("div");

    div.className = "product";

    const image =
      product.image ||
      "https://via.placeholder.com/500x500?text=Nena";

    div.innerHTML = `

      <img
        src="${image}"
        alt="პროდუქტი">

      <h3>
        ${escapeHtml(product.name || "")}
      </h3>

      <p>
        ${escapeHtml(product.description || "")}
      </p>

      <button
        class="deleteBtn"
        onclick="deleteProduct('${product.id}')">
        🗑️ წაშლა
      </button>

    `;

    container.appendChild(div);

  });

}


function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/*
  ფოტოს შეკუმშვა
*/

function compressImage(file) {

  return new Promise((resolve, reject) => {

    if (!file) {

      reject(
        new Error("ფოტო არჩეული არ არის")
      );

      return;

    }

    if (
      file.type &&
      !file.type.startsWith("image/")
    ) {

      reject(
        new Error("არჩეული ფაილი სურათი არ არის")
      );

      return;

    }

    const reader =
      new FileReader();

    reader.onload = function(event) {

      const img =
        new Image();

      img.onload = function() {

        try {

          const maxSize = 600;

          let width = img.width;

          let height = img.height;


          if (width > height) {

            if (width > maxSize) {

              height =
                Math.round(
                  height *
                  maxSize /
                  width
                );

              width = maxSize;

            }

          } else {

            if (height > maxSize) {

              width =
                Math.round(
                  width *
                  maxSize /
                  height
                );

              height = maxSize;

            }

          }


          const canvas =
            document.createElement("canvas");

          canvas.width = width;

          canvas.height = height;


          const ctx =
            canvas.getContext("2d");

          if (!ctx) {

            reject(
              new Error(
                "სურათის დამუშავება ვერ მოხერხდა"
              )
            );

            return;

          }


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          let quality = 0.70;

          let dataUrl =
            canvas.toDataURL(
              "image/jpeg",
              quality
            );


          while (
            dataUrl.length > 450000 &&
            quality > 0.20
          ) {

            quality -= 0.10;

            dataUrl =
              canvas.toDataURL(
                "image/jpeg",
                quality
              );

          }


          if (dataUrl.length > 700000) {

            reject(
              new Error(
                "ფოტო ძალიან დიდია. აირჩიე უფრო პატარა ფოტო."
              )
            );

            return;

          }


          resolve(dataUrl);

        } catch (error) {

          reject(error);

        }

      };


      img.onerror = function() {

        reject(
          new Error(
            "ტელეფონის ეს სურათის ფორმატი ვერ დამუშავდა. სცადე JPG ან PNG ფოტო."
          )
        );

      };


      img.src =
        event.target.result;

    };


    reader.onerror = function() {

      reject(
        new Error(
          "ფაილის წაკითხვა ვერ მოხერხდა"
        )
      );

    };


    reader.readAsDataURL(file);

  });

}

    alert(

      .getElementById("productName")

  const category =

  const description =

  if (!name) {

    alert("შეიყვანე პროდუქტის სახელი");

    return;

  }


  if (!file) {

  const saveButton =

  try {

    saveButton.disabled = true;

    const image =

    console.log(
      "Compressed image:",

      "KB"
    );


    await addDoc(
      collection(db, "products"),
      {

        name: name,

        category: category,

        description: description,

        image: image,

        createdAt: serverTimestamp()

      }
    );


    alert(
      "პროდუქტი წარმატებით დაემატა ✅"
    );


    document
      .getElementById("productName")
      .value = "";


    document
      .getElementById("productDescription")
      .value = "";


    document
      .getElementById("productImage")
      .value = "";


    closeAddModal();


  } catch (error) {

    console.error(
      "ADD PRODUCT ERROR:",
      error
    );


    alert(
      "პროდუქტის დამატება ვერ მოხერხდა:\n\n" +
      (
        error?.message ||
        error?.code ||
        String(error)
      )
    );

  } finally {

    saveButton.disabled = false;

    saveButton.textContent =
      "ატვირთვა";

  }

};


window.deleteProduct = async function(id) {

  const user =
    auth.currentUser;

  if (!user || user.uid !== ADMIN_UID) {

    alert(
      "ამის უფლება მხოლოდ ადმინისტრატორს აქვს"
    );

    return;

  }


  const ok =
    confirm(
      "ნამდვილად გინდა პროდუქტის წაშლა?"
    );


  if (!ok) {

    return;

  }


  try {

    await deleteDoc(
      doc(
        db,
        "products",
        id
      )
    );


    alert("პროდუქტი წაიშალა ✅");


  } catch (error) {

    console.error(
      "DELETE ERROR:",
      error
    );


    alert(
      "წაშლა ვერ მოხერხდა:\n" +
      (
        error?.message ||
        error?.code ||
        String(error)
      )
    );

  }

};


onSnapshot(

  collection(db, "products"),

  snapshot => {

    allProducts = [];

    snapshot.forEach(
      document => {

        allProducts.push({

          id: document.id,

          ...document.data()

        });

      }
    );


    allProducts.sort(
      (a, b) => {

        const aTime =
          a.createdAt?.seconds || 0;

        const bTime =
          b.createdAt?.seconds || 0;

        return bTime - aTime;

      }
    );


    renderProducts();

  },

  error => {

    console.error(
      "FIRESTORE ERROR:",
      error
    );


    document
      .getElementById("status")
      .style.display = "block";


    document
      .getElementById("status")
      .textContent =
        "პროდუქტების ჩატვირთვისას შეცდომაა: " +
        (
          error?.message ||
          error?.code ||
          String(error)
        );

  }

);

</script>
