<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ნენა</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        header {
            height: 65px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            margin: 0;
            color: #ff69b4;
            font-size: 30px;
            font-weight: bold;
        }

        .layout {
            display: flex;
            min-height: calc(100vh - 65px);
        }

        .sidebar {
            width: 230px;
            background: white;
            border-right: 1px solid #ddd;
            padding: 15px;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .category {
            width: 100%;
            border: none;
            background: transparent;
            padding: 12px 10px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 4px;
        }

        .category:hover {
            background: #f0f0f0;
        }

        .category.active {
            background: #e8e8e8;
            font-weight: bold;
        }

        .login-button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .logout-button {
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #d9534f;
            color: white;
            font-size: 15px;
            cursor: pointer;
            display: none;
        }

        .main {
            flex: 1;
            padding: 25px;
            position: relative;
        }

        .main h2 {
            margin-top: 0;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .product img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .product-content {
            padding: 15px;
        }

        .product-content h3 {
            margin: 0 0 8px;
            font-size: 19px;
        }

        .product-content p {
            margin: 0;
            color: #555;
            line-height: 1.4;
        }

        .delete-button {
            margin-top: 12px;
            border: none;
            background: #d9534f;
            color: white;
            padding: 8px 12px;
            border-radius: 7px;
            cursor: pointer;
        }

        .add-button {
            position: fixed;
            right: 25px;
            bottom: 25px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: #222;
            color: white;
            font-size: 38px;
            line-height: 60px;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            z-index: 20;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-box {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 15px;
            padding: 25px;
        }

        .modal-box h2 {
            margin-top: 0;
        }

        .modal-box input[type="password"],
        .modal-box input[type="text"],
        .modal-box textarea,
        .modal-box select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .modal-box textarea {
            min-height: 120px;
            resize: vertical;
        }

        .modal-box input[type="file"] {
            width: 100%;
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .save-button {
            background: #222;
            color: white;
        }

        .cancel-button {
            background: #ddd;
        }

        .error {
            color: #d9534f;
            margin-bottom: 10px;
            display: none;
        }

        @media (max-width: 700px) {

            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #ddd;
            }

            .main {
                padding: 15px;
            }

            .products {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .product img {
                height: 170px;
            }

            .add-button {
                right: 18px;
                bottom: 18px;
            }
        }

        @media (max-width: 430px) {

            .products {
                grid-template-columns: 1fr;
            }

            .product img {
                height: 230px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1 class="logo">🌸 ნენა</h1>
</header>

<div class="layout">

    <aside class="sidebar">

        <div class="sidebar-title">
            სარჩევი
        </div>

        <button class="category active" onclick="showCategory('ყველა', this)">
            🏠 მთავარი
        </button>

        <button class="category" onclick="showCategory('სუნამოები', this)">
            🌸 სუნამოები
        </button>

        <button class="category" onclick="showCategory('ტუშები', this)">
            💄 ტუშები
        </button>

        <button class="category" onclick="showCategory('სათვალეები', this)">
            👓 სათვალეები
        </button>

        <button class="category" onclick="showCategory('ტუჩსაცხები', this)">
            💄 ტუჩსაცხები
        </button>

        <button class="category" onclick="showCategory('კრემები', this)">
            🧴 კრემები
        </button>

        <button class="category" onclick="showCategory('შამპუნები', this)">
            🧼 შამპუნები
        </button>

        <button class="category" onclick="showCategory('სახის მოვლა', this)">
            ✨ სახის მოვლა
        </button>

        <button class="category" onclick="showCategory('სხვა', this)">
            🛍️ სხვა
        </button>

        <button class="login-button" id="loginButton" onclick="openLogin()">
            🔐 შესვლა
        </button>

        <button class="logout-button" id="logoutButton" onclick="logout()">
            გასვლა
        </button>

    </aside>

    <main class="main">

        <h2 id="categoryTitle">
            ყველა პროდუქტი
        </h2>

        <div class="products" id="products"></div>

    </main>

</div>

<button class="add-button" id="addButton" onclick="openAddProduct()">
    +
</button>

<!-- შესვლის ფანჯარა -->
<div class="modal" id="loginModal">

    <div class="modal-box">

        <h2>🔐 ადმინის შესვლა</h2>

        <div class="error" id="loginError">
            პაროლი არასწორია
        </div>

        <input
            type="password"
            id="passwordInput"
            placeholder="შეიყვანეთ 7 ციფრიანი პაროლი"
            maxlength="7"
            inputmode="numeric"
        >

        <div class="modal-buttons">

            <button class="cancel-button" onclick="closeLogin()">
                გაუქმება
            </button>

            <button class="save-button" onclick="login()">
                შესვლა
            </button>

        </div>

    </div>

</div>

<!-- პროდუქტის დამატება -->
<div class="modal" id="productModal">

    <div class="modal-box">

        <h2>➕ პროდუქტის დამატება</h2>

        <input
            type="file"
            id="productImage"
            accept="image/*"
        >

        <input
            type="text"
            id="productName"
            placeholder="პროდუქტის სახელი"
        >

        <select id="productCategory">

            <option value="სუნამოები">🌸 სუნამოები</option>

            <option value="ტუშები">💄 ტუშები</option>

            <option value="სათვალეები">👓 სათვალეები</option>

            <option value="ტუჩსაცხები">💄 ტუჩსაცხები</option>

            <option value="კრემები">🧴 კრემები</option>

            <option value="შამპუნები">🧼 შამპუნები</option>

            <option value="სახის მოვლა">✨ სახის მოვლა</option>

            <option value="სხვა">🛍️ სხვა</option>

        </select>

        <textarea
            id="productDescription"
            placeholder="კომენტარი / აღწერა"
        ></textarea>

        <div class="modal-buttons">

            <button class="cancel-button" onclick="closeProductModal()">
                გაუქმება
            </button>

            <button class="save-button" onclick="addProduct()">
                ატვირთვა
            </button>

        </div>

    </div>

</div>

<script>

    const ADMIN_PASSWORD = "1518079";

    let isAdmin = false;

    let currentCategory = "ყველა";

    let products =
        JSON.parse(localStorage.getItem("nenaProducts")) || [];


    function renderProducts() {

        const container =
            document.getElementById("products");

        container.innerHTML = "";

        let filteredProducts = products;

        if (currentCategory !== "ყველა") {

            filteredProducts =
                products.filter(
                    product =>
                        product.category === currentCategory
                );

        }

        if (filteredProducts.length === 0) {

            container.innerHTML =
                "<p>ამ კატეგორიაში პროდუქტი ჯერ არ არის.</p>";

            return;
        }

        filteredProducts.forEach(product => {

            const card =
                document.createElement("div");

            card.className = "product";

            card.innerHTML = `

                <img
                    src="${product.image}"
                    alt="პროდუქტი"
                >

                <div class="product-content">

                    <h3>
                        ${escapeHtml(product.name)}
                    </h3>

                    <p>
                        ${escapeHtml(product.description)}
                    </p>

                    <button
                        class="delete-button"
                        style="display:${isAdmin ? "inline-block" : "none"}"
                        onclick="deleteProduct(${product.id})"
                    >
                        🗑️ წაშლა
                    </button>

                </div>
            `;

            container.appendChild(card);

        });

    }


    function showCategory(category, button) {

        currentCategory = category;

        document
            .querySelectorAll(".category")
            .forEach(btn =>
                btn.classList.remove("active")
            );

        button.classList.add("active");

        if (category === "ყველა") {

            document.getElementById("categoryTitle")
                .innerText = "ყველა პროდუქტი";

        } else {

            document.getElementById("categoryTitle")
                .innerText = category;

        }

        renderProducts();

    }


    function openLogin() {

        document.getElementById("loginModal")
            .style.display = "flex";

        document.getElementById("passwordInput")
            .value = "";

        document.getElementById("loginError")
            .style.display = "none";

        setTimeout(() => {

            document.getElementById("passwordInput")
                .focus();

        }, 100);

    }


    function closeLogin() {

        document.getElementById("loginModal")
            .style.display = "none";

    }


    function login() {

        const password =
            document.getElementById("passwordInput").value;

        if (password === ADMIN_PASSWORD) {

            isAdmin = true;

            closeLogin();

            document.getElementById("loginButton")
                .style.display = "none";

            document.getElementById("logoutButton")
                .style.display = "block";

            document.getElementById("addButton")
                .style.display = "block";

            renderProducts();

        } else {

            document.getElementById("loginError")
                .style.display = "block";

        }

    }


    function logout() {

        isAdmin = false;

        document.getElementById("loginButton")
            .style.display = "block";

        document.getElementById("logoutButton")
            .style.display = "none";

        document.getElementById("addButton")
            .style.display = "none";

        renderProducts();

    }


    function openAddProduct() {

        if (!isAdmin) return;

        document.getElementById("productModal")
            .style.display = "flex";

    }


    function closeProductModal() {

        document.getElementById("productModal")
            .style.display = "none";

        document.getElementById("productImage").value = "";

        document.getElementById("productName").value = "";

        document.getElementById("productDescription").value = "";

    }


    function addProduct() {

        if (!isAdmin) return;

        const imageInput =
            document.getElementById("productImage");

        const name =
            document.getElementById("productName")
                .value.trim();

        const category =
            document.getElementById("productCategory")
                .value;

        const description =
            document.getElementById("productDescription")
                .value.trim();


        if (!imageInput.files[0]) {

            alert("აირჩიეთ სურათი.");

            return;
        }


        if (!name) {

            alert("შეიყვანეთ პროდუქტის სახელი.");

            return;
        }


        const file = imageInput.files[0];

        const reader = new FileReader();


        reader.onload = function(event) {

            const newProduct = {

                id: Date.now(),

                image: event.target.result,

                name: name,

                category: category,

                description: description

            };


            products.push(newProduct);


            localStorage.setItem(
                "nenaProducts",
                JSON.stringify(products)
            );


            closeProductModal();

            renderProducts();

        };


        reader.readAsDataURL(file);

    }


    function deleteProduct(id) {

        if (!isAdmin) return;

        if (!confirm("ნამდვილად გსურთ პროდუქტის წაშლა?")) {
            return;
        }


        products =
            products.filter(
                product => product.id !== id
            );


        localStorage.setItem(
            "nenaProducts",
            JSON.stringify(products)
        );


        renderProducts();

    }


    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    renderProducts();

</script>

</body>
</html>
