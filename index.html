<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nena</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8f5f7;
    color: #333;
}

header {
    background: #d86b91;
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 30px;
    font-weight: bold;
}

.layout {
    display: flex;
    min-height: calc(100vh - 75px);
}

.sidebar {
    width: 240px;
    background: white;
    padding: 20px 12px;
    box-shadow: 2px 0 8px rgba(0,0,0,0.08);
}

.sidebar h2 {
    margin-top: 0;
    text-align: center;
    color: #d14f7c;
}

.category {
    width: 100%;
    border: none;
    background: transparent;
    padding: 13px 10px;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
    border-radius: 10px;
    margin-bottom: 5px;
}

.category:hover,
.category.active {
    background: #f7dce7;
    color: #c63f6d;
    font-weight: bold;
}

.main {
    flex: 1;
    padding: 25px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    gap: 15px;
}

#categoryTitle {
    margin: 0;
    color: #c63f6d;
}

.add-button {
    background: #d14f7c;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
}

.add-button:hover {
    background: #b83d68;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.product {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    padding-bottom: 15px;
}

.product img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
}

.product-content {
    padding: 15px;
}

.product h3 {
    margin: 0 0 8px;
    color: #c63f6d;
}

.product p {
    margin: 0 0 12px;
    line-height: 1.5;
}

.delete-button {
    border: none;
    background: #e74c3c;
    color: white;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
}

.empty {
    background: white;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    color: #777;
}

/* ფანჯარა */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 1000;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 500px;
    border-radius: 18px;
    padding: 25px;
}

.modal-box h2 {
    margin-top: 0;
    color: #c63f6d;
}

.modal-box label {
    display: block;
    margin-top: 12px;
    margin-bottom: 5px;
    font-weight: bold;
}

.modal-box input,
.modal-box textarea,
.modal-box select {
    width: 100%;
    padding: 11px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

.modal-box textarea {
    height: 110px;
    resize: vertical;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.save-button {
    flex: 1;
    background: #d14f7c;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
}

.cancel-button {
    flex: 1;
    background: #ddd;
    border: none;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
}

@media (max-width: 700px) {

    .layout {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        display: flex;
        overflow-x: auto;
        gap: 5px;
        padding: 10px;
    }

    .sidebar h2 {
        display: none;
    }

    .category {
        min-width: 130px;
        text-align: center;
    }

    .main {
        padding: 15px;
    }

    .top {
        flex-direction: column;
        align-items: stretch;
    }
}
</style>
</head>

<body>

<header>
    Nena
</header>

<div class="layout">

    <aside class="sidebar">

        <h2>სარჩევი</h2>

        <button class="category active" onclick="showCategory('ყველა', this)">
            🏠 ყველა
        </button>

        <button class="category" onclick="showCategory('სუნამოები', this)">
            🧴 სუნამოები
        </button>

        <button class="category" onclick="showCategory('ტუშები', this)">
            💄 ტუშები
        </button>

        <button class="category" onclick="showCategory('სათვალეები', this)">
            👓 სათვალეები
        </button>

        <button class="category" onclick="showCategory('ტუჩსაცხები', this)">
            💄 ტუჩსაცხები
        </button>

        <button class="category" onclick="showCategory('კრემები', this)">
            🧴 კრემები
        </button>

        <button class="category" onclick="showCategory('შამპუნები', this)">
            🧴 შამპუნები
        </button>

        <button class="category" onclick="showCategory('სახის მოვლა', this)">
            💆 სახის მოვლა
        </button>

        <button class="category" onclick="showCategory('სხვა', this)">
            🛍️ სხვა
        </button>

    </aside>


    <main class="main">

        <div class="top">

            <h1 id="categoryTitle">
                ყველა პროდუქტი
            </h1>

            <button class="add-button" onclick="openModal()">
                + პროდუქტის დამატება
            </button>

        </div>

        <div id="products" class="products"></div>

    </main>

</div>


<!-- პროდუქტის დამატების ფანჯარა -->

<div id="modal" class="modal">

    <div class="modal-box">

        <h2>ახალი პროდუქტი</h2>

        <label>პროდუქტის სახელი</label>
        <input
            type="text"
            id="productName"
            placeholder="მაგ: Dior Sauvage"
        >

        <label>კატეგორია</label>

        <select id="productCategory">

            <option value="სუნამოები">🧴 სუნამოები</option>
            <option value="ტუშები">💄 ტუშები</option>
            <option value="სათვალეები">👓 სათვალეები</option>
            <option value="ტუჩსაცხები">💄 ტუჩსაცხები</option>
            <option value="კრემები">🧴 კრემები</option>
            <option value="შამპუნები">🧴 შამპუნები</option>
            <option value="სახის მოვლა">💆 სახის მოვლა</option>
            <option value="სხვა">🛍️ სხვა</option>

        </select>

        <label>აღწერა</label>

        <textarea
            id="productDescription"
            placeholder="დაწერე პროდუქტის აღწერა..."
        ></textarea>

        <label>სურათი</label>

        <input
            type="file"
            id="productImage"
            accept="image/*"
        >

        <div class="modal-buttons">

            <button class="cancel-button" onclick="closeModal()">
                გაუქმება
            </button>

            <button class="save-button" onclick="addProduct()">
                დამატება
            </button>

        </div>

    </div>

</div>


<script>

let products = JSON.parse(localStorage.getItem("nenaProducts")) || [];

let currentCategory = "ყველა";


function saveProducts() {
    localStorage.setItem(
        "nenaProducts",
        JSON.stringify(products)
    );
}


function openModal() {

    document.getElementById("modal").style.display = "flex";

}


function closeModal() {

    document.getElementById("modal").style.display = "none";

    document.getElementById("productName").value = "";
    document.getElementById("productDescription").value = "";
    document.getElementById("productImage").value = "";

}


function addProduct() {

    const name =
        document.getElementById("productName").value.trim();

    const category =
        document.getElementById("productCategory").value;

    const description =
        document.getElementById("productDescription").value.trim();

    const imageFile =
        document.getElementById("productImage").files[0];


    if (!name) {
        alert("ჩაწერე პროდუქტის სახელი");
        return;
    }


    if (!description) {
        alert("ჩაწერე პროდუქტის აღწერა");
        return;
    }


    if (!imageFile) {
        alert("აირჩიე პროდუქტის სურათი");
        return;
    }


    const reader = new FileReader();


    reader.onload = function(e) {

        const product = {

            id: Date.now(),

            name: name,

            category: category,

            description: description,

            image: e.target.result

        };


        products.push(product);

        saveProducts();

        closeModal();

        showProducts();

    };


    reader.readAsDataURL(imageFile);

}


function deleteProduct(id) {

    if (!confirm("ნამდვილად გინდა პროდუქტის წაშლა?")) {
        return;
    }


    products = products.filter(
        product => product.id !== id
    );


    saveProducts();

    showProducts();

}


function showCategory(category, button) {

    currentCategory = category;


    document.querySelectorAll(".category")
        .forEach(btn => btn.classList.remove("active"));


    button.classList.add("active");


    if (category === "ყველა") {

        document.getElementById("categoryTitle").innerText =
            "ყველა პროდუქტი";

    } else {

        document.getElementById("categoryTitle").innerText =
            category;

    }


    showProducts();

}


function showProducts() {

    const container =
        document.getElementById("products");


    container.innerHTML = "";


    let filteredProducts;


    if (currentCategory === "ყველა") {

        filteredProducts = products;

    } else {

        filteredProducts =
            products.filter(
                product => product.category === currentCategory
            );

    }


    if (filteredProducts.length === 0) {

        container.innerHTML = `
            <div class="empty">
                ამ კატეგორიაში ჯერ პროდუქტი არ არის.
                <br><br>
                დააჭირე <b>+ პროდუქტის დამატება</b>-ს.
            </div>
        `;

        return;
    }


    filteredProducts.forEach(product => {

        const card = document.createElement("div");

        card.className = "product";


        card.innerHTML = `

            <img
                src="${product.image}"
                alt="${product.name}"
            >

            <div class="product-content">

                <h3>
                    ${product.name}
                </h3>

                <p>
                    ${product.description}
                </p>

                <button
                    class="delete-button"
                    onclick="deleteProduct(${product.id})"
                >
                    წაშლა
                </button>

            </div>

        `;


        container.appendChild(card);

    });

}


showProducts();

</script>

</body>
</html>
