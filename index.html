<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 ნენა</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff5fa;
      color: #444;
    }

    header {
      background: white;
      padding: 18px;
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #e91e63;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .layout {
      display: flex;
      align-items: flex-start;
    }

    .sidebar {
      width: 220px;
      min-height: calc(100vh - 70px);
      background: white;
      padding: 15px 10px;
      box-shadow: 2px 0 8px rgba(0,0,0,.08);
      position: sticky;
      top: 70px;
    }

    .sidebar button {
      width: 100%;
      border: none;
      background: white;
      padding: 13px 10px;
      margin-bottom: 7px;
      border-radius: 10px;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
    }

    .sidebar button:hover {
      background: #ffe1ed;
    }

    .loginBtn {
      margin-top: 15px;
      background: #e91e63 !important;
      color: white !important;
      text-align: center !important;
    }

    .logoutBtn {
      background: #777 !important;
      color: white !important;
      text-align: center !important;
    }

    main {
      flex: 1;
      padding: 25px;
    }

    #categoryTitle {
      color: #e91e63;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 15px;
      padding: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      position: relative;
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      background: #f5f5f5;
    }

    .product h3 {
      margin: 12px 0 6px;
      color: #e91e63;
    }

    .product p {
      margin: 0;
      color: #666;
      white-space: pre-wrap;
    }

    .deleteBtn {
      display: none;
      width: 100%;
      margin-top: 12px;
      padding: 9px;
      border: none;
      border-radius: 8px;
      background: #f44336;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    body.admin .deleteBtn {
      display: block;
    }

    #addButton {
      display: none;
      position: fixed;
      right: 25px;
      bottom: 25px;
      width: 60px;
      height: 60px;
      border: none;
      border-radius: 50%;
      background: #e91e63;
      color: white;
      font-size: 35px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,.25);
      z-index: 20;
    }

    body.admin #addButton {
      display: block;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modalBox {
      background: white;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 18px;
      padding: 22px;
    }

    .modalBox h2 {
      color: #e91e63;
      margin-top: 0;
    }

    .modalBox input,
    .modalBox textarea,
    .modalBox select {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 16px;
    }

    .modalBox textarea {
      min-height: 100px;
      resize: vertical;
    }

    .saveBtn {
      width: 100%;
      border: none;
      background: #e91e63;
      color: white;
      padding: 13px;
      border-radius: 9px;
      font-size: 17px;
      cursor: pointer;
    }

    .saveBtn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .closeBtn {
      width: 100%;
      border: none;
      background: #777;
      color: white;
      padding: 11px;
      border-radius: 9px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }

    #status {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    @media (max-width: 700px) {

      .layout {
        display: block;
      }

      .sidebar {
        width: 100%;
        min-height: auto;
        position: relative;
        top: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
      }

      .sidebar button {
        margin: 0;
      }

      main {
        padding: 15px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .product img {
        height: 170px;
      }

      header {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<header>🌸 ნენა</header>

<div class="layout">

  <aside class="sidebar">

    <button onclick="showCategory('ყველა')">
      🏠 მთავარი
    </button>

    <button onclick="showCategory('სუნამოები')">
      🌸 სუნამოები
    </button>

    <button onclick="showCategory('ტუშები')">
      💄 ტუშები
    </button>

    <button onclick="showCategory('სათვალეები')">
      👓 სათვალეები
    </button>

    <button onclick="showCategory('ტუჩსაცხები')">
      💄 ტუჩსაცხები
    </button>

    <button onclick="showCategory('კრემები')">
      🧴 კრემები
    </button>

    <button onclick="showCategory('შამპუნები')">
      🧼 შამპუნები
    </button>

    <button onclick="showCategory('სახის მოვლა')">
      🧖 სახის მოვლა
    </button>

    <button onclick="showCategory('სხვა')">
      🛍️ სხვა
    </button>

    <button
      id="loginButton"
      class="loginBtn"
      onclick="openLogin()">
      🔐 შესვლა
    </button>

    <button
      id="logoutButton"
      class="logoutBtn"
      onclick="logout()"
      style="display:none;">
      გასვლა
    </button>

  </aside>

  <main>

    <h1 id="categoryTitle">
      🏠 მთავარი
    </h1>

    <div id="status">
      პროდუქტები იტვირთება...
    </div>

    <div id="products" class="products"></div>

  </main>

</div>

<button
  id="addButton"
  onclick="openAddModal()">
  +
</button>

<div id="loginModal" class="modal">

  <div class="modalBox">

    <h2>🔐 ადმინისტრატორის შესვლა</h2>

    <input
      id="adminPassword"
      type="password"
      placeholder="შეიყვანე პაროლი"
      autocomplete="current-password">

    <button
      class="saveBtn"
      onclick="login()">
      შესვლა
    </button>

    <button
      class="closeBtn"
      onclick="closeLogin()">
      გაუქმება
    </button>

  </div>

</div>

<div id="addModal" class="modal">

  <div class="modalBox">

    <h2>➕ პროდუქტის დამატება</h2>

    <input
      id="productName"
      type="text"
      placeholder="პროდუქტის სახელი">

    <select id="productCategory">

      <option value="სუნამოები">🌸 სუნამოები</option>
      <option value="ტუშები">💄 ტუშები</option>
      <option value="სათვალეები">👓 სათვალეები</option>
      <option value="ტუჩსაცხები">💄 ტუჩსაცხები</option>
      <option value="კრემები">🧴 კრემები</option>
      <option value="შამპუნები">🧼 შამპუნები</option>
      <option value="სახის მოვლა">🧖 სახის მოვლა</option>
      <option value="სხვა">🛍️ სხვა</option>

    </select>

    <input
      id="productImage"
      type="file"
      accept="image/*">

    <textarea
      id="productDescription"
      placeholder="აღწერა / კომენტარი"></textarea>

    <button
      id="uploadButton"
      class="saveBtn"
      onclick="addProduct()">
      ატვირთვა
    </button>

    <button
      class="closeBtn"
      onclick="closeAddModal()">
      გაუქმება
    </button>

  </div>

</div>

<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    onSnapshot,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  /* =========================
     Firebase Storage
     ========================= */

  import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


  /* =========================
     Firebase Config
     ========================= */

  const firebaseConfig = {

    apiKey: "AIzaSyDAOSh708OW7OkOwLsL6w3lOru1qRyhtgM",

    authDomain: "nena-bf825.firebaseapp.com",

    projectId: "nena-bf825",

    storageBucket: "nena-bf825.firebasestorage.app",

    messagingSenderId: "552511105234",

    appId: "1:552511105234:web:38022acc39761284a5650b",

    measurementId: "G-1YB7NH25M5"

  };


  const app =
    initializeApp(firebaseConfig);

  const db =
    getFirestore(app);

  const auth =
    getAuth(app);

  const storage =
    getStorage(app);


  /* =========================
     ადმინისტრატორი
     ========================= */

  const ADMIN_EMAIL =
    "Valerychutlashvili@gmail.com";

  const ADMIN_UID =
    "J9t8FfYXDxQI8q1YkDZOhtLmrLh2";


  let allProducts = [];

  let currentCategory = "ყველა";


  /* =========================
     Login ფანჯარა
     ========================= */

  window.openLogin = function() {

    document.getElementById(
      "loginModal"
    ).style.display = "flex";

    document.getElementById(
      "adminPassword"
    ).focus();

  };


  window.closeLogin = function() {

    document.getElementById(
      "loginModal"
    ).style.display = "none";

  };


  /* =========================
     Login
     ========================= */

  window.login = async function() {

    const password =
      document.getElementById(
        "adminPassword"
      ).value.trim();


    if (!password) {

      alert("შეიყვანე პაროლი");

      return;

    }


    try {

      const result =
        await signInWithEmailAndPassword(
          auth,
          ADMIN_EMAIL,
          password
        );


      if (
        result.user.uid !== ADMIN_UID
      ) {

        await signOut(auth);

        alert(
          "ადმინისტრატორის ანგარიში არასწორია"
        );

        return;

      }


      closeLogin();

      document.getElementById(
        "adminPassword"
      ).value = "";


      alert(
        "წარმატებით შეხვედი ✅"
      );


    } catch (error) {

      console.error(
        "LOGIN ERROR:",
        error.code,
        error.message
      );


      alert(
        "შესვლა ვერ მოხერხდა: " +
        error.code
      );

    }

  };


  /* Enter-ით შესვლა */

  document.getElementById(
    "adminPassword"
  ).addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        login();

      }

    }
  );


  /* =========================
     Auth მდგომარეობა
     ========================= */

  onAuthStateChanged(
    auth,
    user => {

      if (
        user &&
        user.uid === ADMIN_UID
      ) {

        document.body.classList.add(
          "admin"
        );


        document.getElementById(
          "loginButton"
        ).style.display = "none";


        document.getElementById(
          "logoutButton"
        ).style.display = "block";

      } else {

        document.body.classList.remove(
          "admin"
        );


        document.getElementById(
          "loginButton"
        ).style.display = "block";


        document.getElementById(
          "logoutButton"
        ).style.display = "none";

      }

    }
  );


  /* =========================
     გამოსვლა
     ========================= */

  window.logout = async function() {

    try {

      await signOut(auth);

      alert(
        "ადმინისტრატორის რეჟიმი გამორთულია"
      );

    } catch (error) {

      console.error(error);

    }

  };


  /* =========================
     კატეგორიები
     ========================= */

  window.showCategory = function(category) {

    currentCategory = category;

    const title =
      document.getElementById(
        "categoryTitle"
      );


    if (category === "ყველა") {

      title.textContent =
        "🏠 მთავარი";

    } else {

      title.textContent =
        category;

    }


    renderProducts();

  };


  /* =========================
     პროდუქტების ჩვენება
     ========================= */

  function renderProducts() {

    const container =
      document.getElementById(
        "products"
      );


    container.innerHTML = "";


    let products =
      allProducts;


    if (
      currentCategory !== "ყველა"
    ) {

      products =
        allProducts.filter(
          product =>
            product.category ===
            currentCategory
        );

    }


    if (products.length === 0) {

      document.getElementById(
        "status"
      ).style.display = "block";


      document.getElementById(
        "status"
      ).textContent =
        "ამ კატეგორიაში პროდუქტები ჯერ არ არის.";


      return;

    }


    document.getElementById(
      "status"
    ).style.display = "none";


    products.forEach(product => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "product";


      const image =
        product.image ||
        "https://via.placeholder.com/500x500?text=Nena";


      div.innerHTML = `

        <img
          src="${image}"
          alt="პროდუქტი">

        <h3>
          ${escapeHtml(
            product.name || ""
          )}
        </h3>

        <p>
          ${escapeHtml(
            product.description || ""
          )}
        </p>

        <button
          class="deleteBtn"
          onclick="deleteProduct('${product.id}')">
          🗑️ წაშლა
        </button>

      `;


      container.appendChild(div);

    });

  }


  /* =========================
     HTML დაცვა
     ========================= */

  function escapeHtml(text) {

    const div =
      document.createElement(
        "div"
      );

    div.textContent =
      text;

    return div.innerHTML;

  }


  /* =========================
     პროდუქტის დამატების ფანჯარა
     ========================= */

  window.openAddModal =
    function() {

      document.getElementById(
        "addModal"
      ).style.display =
        "flex";

    };


  window.closeAddModal =
    function() {

      document.getElementById(
        "addModal"
      ).style.display =
        "none";

    };


  /* =========================
     ფოტოს ატვირთვა
     ========================= */

  window.addProduct =
    async function() {

      const name =
        document.getElementById(
          "productName"
        ).value.trim();


      const category =
        document.getElementById(
          "productCategory"
        ).value;


      const description =
        document.getElementById(
          "productDescription"
        ).value.trim();


      const file =
        document.getElementById(
          "productImage"
        ).files[0];


      if (!name) {

        alert(
          "შეიყვანე პროდუქტის სახელი"
        );

        return;

      }


      if (!file) {

        alert(
          "აირჩიე პროდუქტის ფოტო"
        );

        return;

      }


      /* მხოლოდ სურათის ფაილი */

      if (
        !file.type ||
        !file.type.startsWith("image/")
      ) {

        alert(
          "გთხოვ აირჩიე JPG, PNG ან სხვა სურათი."
        );

        return;

      }


      const user =
        auth.currentUser;


      if (
        !user ||
        user.uid !== ADMIN_UID
      ) {

        alert(
          "ჯერ ადმინისტრატორად უნდა შეხვიდე."
        );

        return;

      }


      const uploadButton =
        document.getElementById(
          "uploadButton"
        );


      uploadButton.disabled = true;

      uploadButton.textContent =
        "იტვირთება...";


      try {

        /*
         * უნიკალური ფაილის სახელი.
         * ორიგინალი ფოტო პირდაპირ Storage-ში მიდის.
         */

        const extension =
          (
            file.name.split(".").pop() ||
            "jpg"
          ).toLowerCase();


        const safeExtension =
          extension.replace(
            /[^a-z0-9]/gi,
            ""
          ) || "jpg";


        const fileName =
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2, 10) +
          "." +
          safeExtension;


        const storageRef =
          ref(
            storage,
            "products/" + fileName
          );


        /*
         * ტელეფონის JPG პირდაპირ იტვირთება.
         * აღარ ვიყენებთ FileReader-ს და Canvas-ს.
         */

        await uploadBytes(
          storageRef,
          file,
          {
            contentType:
              file.type || "image/jpeg"
          }
        );


        /*
         * ვიღებთ ფოტოს საჯარო URL-ს
         */

        const imageUrl =
          await getDownloadURL(
            storageRef
          );


        /*
         * Firestore-ში ინახება მხოლოდ URL.
         */

        await addDoc(
          collection(
            db,
            "products"
          ),
          {

            name:
              name,

            category:
              category,

            description:
              description,

            image:
              imageUrl,

            createdAt:
              serverTimestamp()

          }
        );


        alert(
          "პროდუქტი დაემატა ✅"
        );


        document.getElementById(
          "productName"
        ).value = "";


        document.getElementById(
          "productDescription"
        ).value = "";


        document.getElementById(
          "productImage"
        ).value = "";


        closeAddModal();


      } catch (error) {

        console.error(
          "ADD PRODUCT ERROR:",
          error
        );


        alert(
          "პროდუქტის დამატება ვერ მოხერხდა:\n" +
          error.code +
          "\n\n" +
          error.message
        );

      } finally {

        uploadButton.disabled =
          false;

        uploadButton.textContent =
          "ატვირთვა";

      }

    };


  /* =========================
     პროდუქტის წაშლა
     ========================= */

  window.deleteProduct =
    async function(id) {

      const user =
        auth.currentUser;


      if (
        !user ||
        user.uid !== ADMIN_UID
      ) {

        alert(
          "ამის უფლება მხოლოდ ადმინისტრატორს აქვს"
        );

        return;

      }


      const ok =
        confirm(
          "ნამდვილად გინდა პროდუქტის წაშლა?"
        );


      if (!ok) {

        return;

      }


      try {

        await deleteDoc(
          doc(
            db,
            "products",
            id
          )
        );


        alert(
          "პროდუქტი წაიშალა ✅"
        );


      } catch (error) {

        console.error(
          "DELETE ERROR:",
          error.code,
          error.message
        );


        alert(
          "წაშლა ვერ მოხერხდა: " +
          error.code
        );

      }

    };


  /* =========================
     Firebase სინქრონიზაცია
     ========================= */

  onSnapshot(

    collection(
      db,
      "products"
    ),

    snapshot => {

      allProducts = [];


      snapshot.forEach(
        document => {

          allProducts.push({

            id:
              document.id,

            ...document.data()

          });

        }
      );


      allProducts.sort(
        (a, b) => {

          const aTime =
            a.createdAt?.seconds ||
            0;


          const bTime =
            b.createdAt?.seconds ||
            0;


          return bTime - aTime;

        }
      );


      renderProducts();

    },


    error => {

      console.error(
        "FIRESTORE ERROR:",
        error.code,
        error.message
      );


      document.getElementById(
        "status"
      ).style.display =
        "block";


      document.getElementById(
        "status"
      ).textContent =
        "პროდუქტების ჩატვირთვისას შეცდომაა: " +
        error.code;

    }

  );

</script>
